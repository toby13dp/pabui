<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PabUI Page Builder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top-bar">
    <div class="brand">
      <div class="brand-mark">PB</div>
      <div>
        <div class="brand-title">PabUI Page Builder</div>
        <div class="brand-subtitle">Enterprise-grade composability</div>
      </div>
    </div>
    <div class="toolbar">
      <button id="newPage" class="ghost">Nieuwe pagina</button>
      <button id="undo" class="ghost">Undo</button>
      <button id="redo" class="ghost">Redo</button>
      <button id="save" class="primary">Opslaan</button>
      <button id="load" class="ghost">Herstel</button>
      <button id="exportHtml" class="primary">Exporteer HTML</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="panel palette">
      <div class="panel-header">
        <div>
          <div class="panel-title">Componenten</div>
          <div class="panel-caption">Sleep naar het canvas</div>
        </div>
        <button id="toggleGrid" class="ghost">Raster aan</button>
      </div>
      <div class="component-grid" id="componentGrid"></div>
    </aside>

    <section class="canvas-shell">
      <div class="canvas-header">
        <div>
          <div class="panel-title">Canvas</div>
          <div class="panel-caption">Klik om te selecteren</div>
        </div>
        <div class="canvas-actions">
          <label class="switch">
            <input type="checkbox" id="snapToggle" />
            <span class="slider"></span>
            <span class="label">Snap</span>
          </label>
        </div>
      </div>
      <div id="canvas" class="canvas droppable" aria-label="Ontwerpcanvas"></div>
    </section>

    <aside class="panel inspector">
      <div class="panel-header">
        <div>
          <div class="panel-title">Inspector</div>
          <div class="panel-caption">Eigenschappen van selectie</div>
        </div>
      </div>
      <form id="inspectorForm" class="inspector-form">
        <div class="field">
          <label for="contentInput">Tekst / Label</label>
          <textarea id="contentInput" rows="3" placeholder="Tekst voor dit element"></textarea>
        </div>
        <div class="field inline">
          <label for="fontSizeInput">Fontgrootte</label>
          <input type="text" id="fontSizeInput" placeholder="16px of 1.1rem" />
        </div>
        <div class="field inline">
          <label for="bgInput">Achtergrond</label>
          <input type="color" id="bgInput" value="#ffffff" />
        </div>
        <div class="field inline">
          <label for="textColorInput">Tekstkleur</label>
          <input type="color" id="textColorInput" value="#1f2933" />
        </div>
        <div class="field inline">
          <label for="paddingInput">Padding</label>
          <input type="text" id="paddingInput" placeholder="24px" />
        </div>
        <div class="field inline">
          <label for="marginInput">Margin</label>
          <input type="text" id="marginInput" placeholder="0 0 16px 0" />
        </div>
        <div class="field inline">
          <label for="widthInput">Breedte</label>
          <input type="text" id="widthInput" placeholder="100% of 320px" />
        </div>
        <div class="field inline">
          <label for="heightInput">Hoogte</label>
          <input type="text" id="heightInput" placeholder="auto of 200px" />
        </div>
        <div class="field inline">
          <label for="gapInput">Gap (stack/grid)</label>
          <input type="text" id="gapInput" placeholder="12px" />
        </div>
        <div class="field">
          <label for="alignmentSelect">Uitlijning</label>
          <select id="alignmentSelect">
            <option value="">Standaard</option>
            <option value="flex-start">Links</option>
            <option value="center">Centraal</option>
            <option value="flex-end">Rechts</option>
          </select>
        </div>
        <div class="field">
          <label for="textAlignSelect">Tekstuitlijning</label>
          <select id="textAlignSelect">
            <option value="">Volg component</option>
            <option value="left">Links</option>
            <option value="center">Centraal</option>
            <option value="right">Rechts</option>
          </select>
        </div>
        <div class="field inline">
          <label for="radiusInput">Hoekradius</label>
          <input type="text" id="radiusInput" placeholder="12px" />
        </div>
        <div class="field inline">
          <label for="borderInput">Rand</label>
          <input type="text" id="borderInput" placeholder="1px solid #1f2a44" />
        </div>
        <div class="field inline">
          <label for="shadowSelect">Schaduw</label>
          <select id="shadowSelect">
            <option value="">Geen</option>
            <option value="soft">Zacht</option>
            <option value="strong">Sterk</option>
            <option value="glow">Accent glow</option>
          </select>
        </div>
        <button type="button" id="applyStyles" class="primary">Pas toe</button>
        <div class="inspector-actions">
          <button type="button" id="duplicate" class="ghost">Dupliceer</button>
          <button type="button" id="delete" class="ghost danger">Verwijder</button>
        </div>
      </form>
      <div id="selectionMeta" class="note">Selecteer een element op het canvas om eigenschappen te wijzigen.</div>
    </aside>
  </main>

  <div id="exportModal" class="modal" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <div class="panel-title">Gegenereerde HTML</div>
          <div class="panel-caption">Kopieer of download</div>
        </div>
        <button id="closeModal" class="ghost">Sluit</button>
      </div>
      <textarea id="exportOutput" rows="12"></textarea>
      <div class="modal-actions">
        <button id="copyHtml" class="primary">Kopieer</button>
        <button id="downloadHtml" class="ghost">Download</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
